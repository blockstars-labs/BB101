<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Las tres opciones de liquidación que tiene hoy un fondo mediano: ninguna es a la vez rápida, confidencial y accesible">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3A3530; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: .14em; fill: #9A7B5C; }
    .h { font-size: 13px; font-weight: 700; }
    .r { font-size: 14px; }
    .s { font-size: 12.5px; fill: #6B625A; }
    .w { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x="1" y="1" width="898" height="298" rx="18" fill="#FBF7F0" stroke="#EADFCF"/>
  <text x="36" y="44" class="k">LAS TRES OPCIONES QUE TIENE HOY UN FONDO MEDIANO</text>

  <rect x="288" y="64" width="184" height="40" rx="10" fill="#F1E7D8" stroke="#E2D3BD"/>
  <rect x="484" y="64" width="184" height="40" rx="10" fill="#F1E7D8" stroke="#E2D3BD"/>
  <rect x="680" y="64" width="184" height="40" rx="10" fill="#F1E7D8" stroke="#E2D3BD"/>
  <text x="380" y="89" class="h" text-anchor="middle">Cadena tradicional</text>
  <text x="576" y="89" class="h" text-anchor="middle">Red pública</text>
  <text x="772" y="89" class="h" text-anchor="middle">Red privada por invitación</text>

  <g stroke="#EADFCF">
    <line x1="36" y1="114" x2="864" y2="114"/>
    <line x1="36" y1="158" x2="864" y2="158"/>
    <line x1="36" y1="202" x2="864" y2="202"/>
    <line x1="36" y1="246" x2="864" y2="246"/>
  </g>
  <text x="36" y="141" class="r">Liquida rápido</text>
  <text x="36" y="185" class="r">Es confidencial</text>
  <text x="36" y="229" class="r">Un fondo mediano puede usarla</text>

  <!-- Cadena tradicional: lenta, confidencial, accesible -->
  <circle cx="380" cy="136" r="13" fill="#C8775A"/><text x="380" y="141" class="w" text-anchor="middle">✕</text>
  <circle cx="380" cy="180" r="13" fill="#8FA98A"/><text x="380" y="185" class="w" text-anchor="middle">✓</text>
  <circle cx="380" cy="224" r="13" fill="#8FA98A"/><text x="380" y="229" class="w" text-anchor="middle">✓</text>
  <!-- Red pública: rápida, expuesta, accesible -->
  <circle cx="576" cy="136" r="13" fill="#8FA98A"/><text x="576" y="141" class="w" text-anchor="middle">✓</text>
  <circle cx="576" cy="180" r="13" fill="#C8775A"/><text x="576" y="185" class="w" text-anchor="middle">✕</text>
  <circle cx="576" cy="224" r="13" fill="#8FA98A"/><text x="576" y="229" class="w" text-anchor="middle">✓</text>
  <!-- Red privada por invitación: rápida, confidencial, solo grandes bancos -->
  <circle cx="772" cy="136" r="13" fill="#8FA98A"/><text x="772" y="141" class="w" text-anchor="middle">✓</text>
  <circle cx="772" cy="180" r="13" fill="#8FA98A"/><text x="772" y="185" class="w" text-anchor="middle">✓</text>
  <circle cx="772" cy="224" r="13" fill="#C8775A"/><text x="772" y="229" class="w" text-anchor="middle">✕</text>

  <text x="450" y="278" class="s" text-anchor="middle">Ninguna opción es a la vez rápida, confidencial y accesible para un fondo mediano.</text>
</svg>
