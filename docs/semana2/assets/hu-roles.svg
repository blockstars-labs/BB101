<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Los siete roles alrededor del historial del activo: ganadero, veterinario, banco, otro prestamista, frigorífico, inversionista y aseguradora">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B59C80"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3A3530; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: .14em; fill: #9A7B5C; }
    .b { font-size: 14px; font-weight: 700; }
    .m { font-size: 12.5px; }
    .s { font-size: 12px; fill: #6B625A; }
    .n { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x="1" y="1" width="898" height="328" rx="18" fill="#FBF7F0" stroke="#EADFCF"/>
  <text x="36" y="42" class="k">QUIÉN ESCRIBE Y QUIÉN CONSULTA EL HISTORIAL DEL ACTIVO</text>

  <!-- centro -->
  <rect x="340" y="128" width="220" height="92" rx="14" fill="#F2E7D6" stroke="#D9C4A5"/>
  <text x="450" y="162" class="b" text-anchor="middle">📒 Historial del animal</text>
  <text x="450" y="184" class="s" text-anchor="middle">un solo registro compartido</text>
  <text x="450" y="202" class="s" text-anchor="middle">que nadie puede reescribir</text>

  <!-- escriben (izquierda) -->
  <text x="36" y="80" class="s">Escriben</text>
  <rect x="36" y="92" width="210" height="62" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
  <circle cx="58" cy="112" r="10" fill="#8FA98A"/><text x="58" y="116" class="n" text-anchor="middle">1</text>
  <text x="76" y="117" class="b">🐄 Ganadero</text>
  <text x="76" y="138" class="m">registra cada animal</text>
  <rect x="36" y="196" width="210" height="62" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
  <circle cx="58" cy="216" r="10" fill="#C9A26B"/><text x="58" y="220" class="n" text-anchor="middle">4</text>
  <text x="76" y="221" class="b">🩺 Veterinario</text>
  <text x="76" y="242" class="m">firma vacunas y revisiones</text>
  <line x1="246" y1="123" x2="338" y2="160" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <line x1="246" y1="227" x2="338" y2="192" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>

  <!-- consultan (derecha) -->
  <text x="654" y="62" class="s">Consultan antes de confiar</text>
  <g>
    <rect x="654" y="72" width="210" height="40" rx="20" fill="#FFFFFF" stroke="#E2D3BD"/>
    <rect x="654" y="118" width="210" height="40" rx="20" fill="#FFFFFF" stroke="#E2D3BD"/>
    <rect x="654" y="164" width="210" height="40" rx="20" fill="#FFFFFF" stroke="#E2D3BD"/>
    <rect x="654" y="210" width="210" height="40" rx="20" fill="#FFFFFF" stroke="#E2D3BD"/>
    <rect x="654" y="256" width="210" height="40" rx="20" fill="#FFFFFF" stroke="#E2D3BD"/>
  </g>
  <g>
    <circle cx="676" cy="92" r="10" fill="#6E8CA0"/><text x="676" y="96" class="n" text-anchor="middle">2</text>
    <circle cx="676" cy="138" r="10" fill="#6E8CA0"/><text x="676" y="142" class="n" text-anchor="middle">3</text>
    <circle cx="676" cy="184" r="10" fill="#6E8CA0"/><text x="676" y="188" class="n" text-anchor="middle">5</text>
    <circle cx="676" cy="230" r="10" fill="#6E8CA0"/><text x="676" y="234" class="n" text-anchor="middle">6</text>
    <circle cx="676" cy="276" r="10" fill="#6E8CA0"/><text x="676" y="280" class="n" text-anchor="middle">7</text>
  </g>
  <g class="m">
    <text x="694" y="97">🏦 Banco o cooperativa</text>
    <text x="694" y="143">🔎 Otro prestamista</text>
    <text x="694" y="189">🥩 Frigorífico exportador</text>
    <text x="694" y="235">🌱 Inversionista pequeño</text>
    <text x="694" y="281">🛡️ Aseguradora</text>
  </g>
  <line x1="562" y1="174" x2="650" y2="174" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>

  <text x="36" y="306" class="s">Los números son los de cada historia de usuario.</text>
</svg>
