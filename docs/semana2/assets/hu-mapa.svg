<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Las siete historias sobre el recorrido de la plata en una obra: garantía, materiales, etapas, aprobación, disputa y saldo">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B59C80"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3A3530; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: .14em; fill: #9A7B5C; }
    .b { font-size: 13px; font-weight: 700; }
    .m { font-size: 11.5px; }
    .s { font-size: 11.5px; fill: #6B625A; }
    .f { font-size: 10.5px; font-weight: 700; fill: #B5563A; }
    .n { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x="1" y="1" width="898" height="318" rx="18" fill="#FBF7F0" stroke="#EADFCF"/>
  <text x="30" y="40" class="k">DÓNDE ENTRA CADA HISTORIA EN EL RECORRIDO DE LA PLATA</text>
  <text x="30" y="60" class="s">Los números son las historias; F1 a F5 son las fricciones del Problem Brief.</text>

  <g>
    <rect x="30"  y="84" width="150" height="96" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
    <rect x="200" y="84" width="150" height="96" rx="12" fill="#F2E7D6" stroke="#D9C4A5"/>
    <rect x="370" y="84" width="150" height="96" rx="12" fill="#F2E7D6" stroke="#D9C4A5"/>
    <rect x="540" y="84" width="150" height="96" rx="12" fill="#E3EAF0" stroke="#C3D1DC"/>
    <rect x="710" y="84" width="160" height="96" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
  </g>
  <g class="b">
    <text x="44" y="108">🔒 Garantía</text>
    <text x="214" y="108">🔩 Materiales</text>
    <text x="384" y="108">📸 Etapa</text>
    <text x="554" y="108">✅ Aprobación</text>
    <text x="724" y="108">💵 Pago</text>
  </g>
  <g class="m">
    <text x="44" y="128">La familia deposita;</text>
    <text x="44" y="144">el maestro la ve</text>
    <text x="214" y="128">Se le paga directo</text>
    <text x="214" y="144">a la ferretería</text>
    <text x="384" y="128">El maestro sube</text>
    <text x="384" y="144">fotos del avance</text>
    <text x="554" y="128">La familia (o el</text>
    <text x="554" y="144">interventor) aprueba</text>
    <text x="724" y="128">Sale la plata de esa</text>
    <text x="724" y="144">etapa; al final, el saldo</text>
  </g>
  <g class="f">
    <text x="44" y="170">F1</text>
    <text x="214" y="170">F3</text>
    <text x="384" y="170">F2</text>
    <text x="554" y="170">F2 · F4</text>
    <text x="724" y="170">F4</text>
  </g>
  <g stroke="#B59C80" stroke-width="2" marker-end="url(#a)">
    <line x1="180" y1="132" x2="198" y2="132"/>
    <line x1="350" y1="132" x2="368" y2="132"/>
    <line x1="520" y1="132" x2="538" y2="132"/>
    <line x1="690" y1="132" x2="708" y2="132"/>
  </g>
  <path d="M790,182 C790,206 450,206 450,184" fill="none" stroke="#B59C80" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="462" y="218" class="s">se repite por cada etapa</text>

  <g>
    <circle cx="160" cy="98" r="11" fill="#8FA98A"/><text x="160" y="102" class="n" text-anchor="middle">1</text>
    <circle cx="160" cy="164" r="11" fill="#8FA98A"/><text x="160" y="168" class="n" text-anchor="middle">2</text>
    <circle cx="330" cy="98" r="11" fill="#C9A26B"/><text x="330" y="102" class="n" text-anchor="middle">5</text>
    <circle cx="500" cy="98" r="11" fill="#C9A26B"/><text x="500" y="102" class="n" text-anchor="middle">3</text>
    <circle cx="670" cy="98" r="11" fill="#6E8CA0"/><text x="670" y="102" class="n" text-anchor="middle">6</text>
  </g>

  <rect x="540" y="232" width="330" height="62" rx="12" fill="#F6E3DA" stroke="#E2B9A6" stroke-dasharray="5 4"/>
  <circle cx="560" cy="252" r="11" fill="#C98A6E"/><text x="560" y="256" class="n" text-anchor="middle">4</text>
  <text x="578" y="257" class="b">⚖️ Si no hay acuerdo</text>
  <text x="578" y="278" class="m">un mediador revisa la evidencia y decide · F5</text>
  <line x1="615" y1="182" x2="615" y2="230" stroke="#C98A6E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="30" y="232" width="490" height="62" rx="12" fill="#FFFFFF" stroke="#E2D3BD"/>
  <circle cx="50" cy="252" r="11" fill="#8E7AA6"/><text x="50" y="256" class="n" text-anchor="middle">7</text>
  <text x="68" y="257" class="b">📱 En todo el recorrido</text>
  <text x="68" y="278" class="m">desde el celular, en pesos y sin saber de cripto (riesgo de adopción)</text>
</svg>
