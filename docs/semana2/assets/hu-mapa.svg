<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="En los dos problemas hay dos partes que no confían entre sí y un pago que solo debería moverse cuando se cumple lo acordado">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B59C80"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #3A3530; }
    .k { font-size: 12px; font-weight: 700; letter-spacing: .14em; fill: #9A7B5C; }
    .b { font-size: 14px; font-weight: 700; }
    .m { font-size: 12.5px; }
    .s { font-size: 12px; fill: #6B625A; }
    .n { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <rect x="1" y="1" width="898" height="298" rx="18" fill="#FBF7F0" stroke="#EADFCF"/>
  <text x="36" y="42" class="k">EL MISMO NUDO EN LOS DOS PROBLEMAS</text>
  <text x="36" y="64" class="s">Dos partes que no confían entre sí y un pago que solo debería moverse cuando se cumple lo acordado.</text>

  <!-- fila 1: liquidación -->
  <rect x="36" y="86" width="190" height="74" rx="12" fill="#E3EAF0" stroke="#C3D1DC"/>
  <circle cx="56" cy="106" r="10" fill="#6E8CA0"/><text x="56" y="110" class="n" text-anchor="middle">5</text>
  <text x="74" y="111" class="b">📈 Fondo vendedor</text>
  <text x="74" y="132" class="m">entrega el activo</text>
  <text x="74" y="150" class="s">(facturas, bonos)</text>
  <rect x="674" y="86" width="190" height="74" rx="12" fill="#E3EAF0" stroke="#C3D1DC"/>
  <circle cx="694" cy="106" r="10" fill="#6E8CA0"/><text x="694" y="110" class="n" text-anchor="middle">6</text>
  <text x="712" y="111" class="b">💼 Tesorero</text>
  <text x="712" y="132" class="m">paga sin que el mercado</text>
  <text x="712" y="150" class="m">vea precio ni monto</text>
  <rect x="330" y="92" width="240" height="62" rx="31" fill="#FFFFFF" stroke="#E2D3BD"/>
  <text x="450" y="118" class="b" text-anchor="middle">🔒 Activo contra pago</text>
  <text x="450" y="138" class="s" text-anchor="middle">al mismo tiempo, o no pasa nada</text>
  <line x1="228" y1="123" x2="328" y2="123" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <line x1="672" y1="123" x2="572" y2="123" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>

  <!-- fila 2: obra -->
  <rect x="36" y="184" width="190" height="74" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
  <circle cx="56" cy="204" r="10" fill="#8FA98A"/><text x="56" y="208" class="n" text-anchor="middle">1</text>
  <text x="74" y="209" class="b">🏠 Familia</text>
  <text x="74" y="230" class="m">deposita el valor</text>
  <text x="74" y="248" class="s">y aprueba cada etapa</text>
  <rect x="674" y="184" width="190" height="74" rx="12" fill="#E4ECE3" stroke="#C9D6C6"/>
  <circle cx="694" cy="204" r="10" fill="#8FA98A"/><text x="694" y="208" class="n" text-anchor="middle">2</text>
  <text x="712" y="209" class="b">🧱 Maestro</text>
  <text x="712" y="230" class="m">ve la plata bloqueada</text>
  <text x="712" y="248" class="s">y cobra por etapa</text>
  <rect x="330" y="190" width="240" height="62" rx="31" fill="#FFFFFF" stroke="#E2D3BD"/>
  <text x="450" y="216" class="b" text-anchor="middle">🔒 Plata en garantía</text>
  <text x="450" y="236" class="s" text-anchor="middle">se libera etapa por etapa</text>
  <line x1="228" y1="221" x2="328" y2="221" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <line x1="572" y1="221" x2="672" y2="221" stroke="#B59C80" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>

  <text x="36" y="284" class="s">Las historias 3 (registro del acuerdo), 4 (mediador) y 7 (auditor) cuidan que las dos filas sean confiables. Los números son los de cada historia.</text>
</svg>
